<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sınav Ailesi | Ana Terminal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <script>
        const SB_URL = 'https://ibsoxmtdmlzflvdnsenj.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlic294bXRkbWx6Zmx2ZG5zZW5qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwOTU5ODgsImV4cCI6MjA4MDY3MTk4OH0.NFeO1KUR5FVPADuAuFS0ogmSfcM_-W_XkpUhGuCPqHc';
        const sb = supabase.createClient(SB_URL, SB_KEY);

        async function guvenlik() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) window.location.href = "yonetim.html"; 
        }
        guvenlik();
    </script>

    <style>
        /* --- KARMA GERÇEKÇİ & NEON PALET --- */
        :root {
            --neon-teal: #00f3ff; /* Parlak Neon Turkuaz */
            --neon-blue: #0066ff; /* Parlak Neon Mavi */
            --brand-teal: #1abc9c; /* Kurumsal Mat Turkuaz */
            --dark-metal: #111;
            --panel-bg: rgba(25, 25, 25, 0.85);
            --text-highlight: #fff;
            --text-muted: #aaa;
        }

        body {
            background-color: #020204;
            /* Hafif devre kartı dokusu + siber ızgara */
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 243, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 102, 255, 0.08) 0%, transparent 50%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-highlight);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding-bottom: 3rem;
        }

        /* --- NAVBAR --- */
        .hybrid-nav {
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            padding: 1rem 0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 3rem;
        }

        .brand-logo {
            font-weight: 900;
            font-size: 1.4rem;
            /* Neon parlama efekti */
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            letter-spacing: 1px;
        }

        /* --- HİBRİT KART YAPISI (Metal + Cam + Neon) --- */
        .hybrid-card {
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 2.5rem;
            /* Çok katmanlı gerçekçi gölge + hafif neon sızıntısı */
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.9), /* Derin gölge */
                inset 0 1px 1px rgba(255, 255, 255, 0.15), /* Üst kenar ışığı */
                0 0 20px rgba(0, 243, 255, 0.05); /* Hafif dış neon */
            position: relative;
            overflow: hidden;
        }

        /* Üstteki Parlayan Çizgi */
        .hybrid-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--neon-teal), var(--neon-blue));
            box-shadow: 0 2px 15px rgba(0, 243, 255, 0.4);
        }

        h5.card-title {
            font-weight: 700; color: white; margin-bottom: 1.5rem; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 10px; text-transform: uppercase;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
        }

        /* --- INPUTLAR (İçe Gömülü + Neon Odaklı) --- */
        .input-wrapper { margin-bottom: 1.5rem; position: relative; }
        
        .form-label {
            font-size: 0.75rem; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; margin-bottom: 8px; display: block; letter-spacing: 1px;
        }

        .real-input {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 14px 15px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Consolas', monospace;
            /* İçe gömülme (Tactile Feel) */
            box-shadow: inset 3px 3px 8px rgba(0,0,0,0.9), inset -1px -1px 3px rgba(255,255,255,0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .real-input:focus {
            outline: none;
            border-color: var(--neon-teal);
            background: #0f0f0f;
            /* Gömülme azalır, dışarı neon taşar */
            box-shadow: 
                0 0 15px rgba(0, 243, 255, 0.3), /* Dış Neon */
                inset 1px 1px 2px rgba(0,0,0,0.5); /* Hafif iç gölge */
        }
        
        .real-input::placeholder { color: #444; }

        /* Select ok işareti (Neonlu) */
        .select-wrapper::after {
            content: '▼'; position: absolute; right: 15px; top: 45px; color: var(--neon-teal); font-size: 0.7rem; pointer-events: none; text-shadow: 0 0 5px var(--neon-teal);
        }
        select.real-input { appearance: none; cursor: pointer; }
        option { background: #111; padding: 10px; }

        /* --- BUTON (Fiziksel + Enerji Dolu) --- */
        .btn-hybrid {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            /* Kurumsal renklerin parlak hali */
            background: linear-gradient(145deg, var(--brand-teal), #008cba);
            color: white;
            font-weight: 900;
            font-size: 1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            /* Fiziksel derinlik + İçten yanmalı ışık */
            box-shadow: 
                0 6px 0 #0e6655, /* Fiziksel alt kısım */
                0 15px 25px rgba(0,0,0,0.6), /* Gölge */
                0 0 20px rgba(26, 188, 156, 0.4); /* İç neon parlaması */
            transition: all 0.15s;
            cursor: pointer;
            position: relative; top: 0;
        }

        .btn-hybrid:hover { filter: brightness(1.2); box-shadow: 0 6px 0 #0e6655, 0 15px 25px rgba(0,0,0,0.6), 0 0 30px rgba(26, 188, 156, 0.6); }
        
        .btn-hybrid:active {
            top: 6px; /* Basılma hareketi */
            box-shadow: 
                0 0 0 #0e6655, /* Alt kısım kaybolur */
                inset 0 3px 10px rgba(0,0,0,0.4); /* İçe göçme gölgesi */
        }

        /* --- SAĞ TARAF: LİSTE --- */
        .list-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px;
        }

        .table-container {
            max-height: 700px; overflow-y: auto; padding-right: 8px;
        }
        .table-container::-webkit-scrollbar { width: 6px; }
        .table-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .table-container::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; border: 1px solid #444; }

        /* Liste Kartı (Veri Akışı) */
        .list-card {
            background: rgba(20, 20, 20, 0.6);
            border-left: 3px solid #333;
            border-radius: 4px;
            padding: 1.2rem;
            margin-bottom: 12px;
            display: grid;
            grid-template-columns: 2.5fr 2fr 1.5fr;
            align-items: center;
            transition: all 0.2s;
            position: relative;
        }

        .list-card:hover {
            background: rgba(30, 30, 30, 0.8);
            border-left-color: var(--neon-teal);
            box-shadow: -5px 0 20px rgba(0, 243, 255, 0.15);
            transform: translateX(5px);
        }

        .name-text { font-weight: 700; color: #fff; font-size: 1rem; }
        .date-text { font-size: 0.75rem; color: #888; font-family: monospace; margin-top: 4px; display: flex; align-items: center; gap: 5px; }
        
        .expert-info { display: flex; align-items: center; gap: 8px; color: #ccc; font-size: 0.9rem; }
        .expert-info i { color: var(--neon-blue); filter: drop-shadow(0 0 5px var(--neon-blue)); }

        /* Badges (Neonlu) */
        .status-pill { text-align: right; justify-self: end; }
        .pill-neon-green { background: rgba(0, 243, 255, 0.1); color: var(--neon-teal); border: 1px solid var(--neon-teal); padding: 5px 12px; font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
        .pill-neon-red { background: rgba(255, 0, 80, 0.1); color: #ff0050; border: 1px solid #ff0050; padding: 5px 12px; font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; box-shadow: 0 0 10px rgba(255, 0, 80, 0.2); }

        /* Mobilde kart yapısı */
        @media (max-width: 768px) {
            .list-card { grid-template-columns: 1fr; gap: 12px; text-align: center; padding: 1.5rem; border-left: none; border-top: 3px solid #333; }
            .list-card:hover { transform: translateY(-5px); border-top-color: var(--neon-teal); }
            .status-pill { justify-self: center; width: 100%; }
            .col-lg-8 { margin-top: 2rem; }
        }

        /* Çıkış Butonu */
        .btn-logout {
            background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue);
            padding: 6px 16px; font-size: 0.85rem; transition: 0.3s; letter-spacing: 1px; text-transform: uppercase; font-weight: 700;
        }
        .btn-logout:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }
        
        #basari_msg { display:none; margin-top: 20px; padding: 12px; background: rgba(0, 243, 255, 0.1); color: var(--neon-teal); text-align: center; font-weight: 700; border: 1px solid var(--neon-teal); box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); }
    </style>
</head>
<body>

    <nav class="hybrid-nav sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="brand-logo">
                <i class="fas fa-microchip me-2" style="color:var(--neon-teal);"></i>SINAV AİLESİ <span style="opacity:0.6; font-size:0.8em;">// SYSTEM</span>
            </div>
            <button onclick="cikisYap()" class="btn-logout">
                <i class="fas fa-power-off me-2"></i>ÇIKIŞ
            </button>
        </div>
    </nav>

    <div class="container">
        <div class="row g-5">
            
            <div class="col-lg-4">
                <div class="hybrid-card">
                    <h5 class="card-title">
                        <i class="fas fa-pen-to-square" style="color:var(--neon-teal)"></i> Veri Giriş Terminali
                    </h5>

                    <div class="input-wrapper">
                        <label class="form-label">Görüşülen Kişi</label>
                        <input type="text" id="kisi" class="real-input" placeholder="AD SOYAD GİRİNİZ...">
                    </div>

                    <div class="input-wrapper">
                        <label class="form-label">Zaman Damgası</label>
                        <input type="datetime-local" id="tarih" step="1" class="real-input">
                    </div>

                    <div class="input-wrapper select-wrapper">
                        <label class="form-label">Kapsam Durumu</label>
                        <select id="kapsam" class="real-input">
                            <option value="">SEÇİNİZ...</option>
                            <option value="EVET">EVET (SORUN TESPİT EDİLDİ)</option>
                            <option value="HAYIR">HAYIR (SORUN YOK)</option>
                        </select>
                    </div>

                    <div class="input-wrapper select-wrapper">
                        <label class="form-label">Atanan Uzman</label>
                        <select id="uzman" class="real-input">
                            <option value="">SEÇİNİZ...</option>
                            <option value="Emine Demir">EMİNE DEMİR (PSİKOLOJİ)</option>
                            <option value="Murat Çelik">MURAT ÇELİK (EĞİTİM)</option>
                            <option value="Bülent Herek">BÜLENT HEREK (SAĞLIK)</option> 
                            <option value="Murat Altunkaya">MURAT ALTUNKAYA (MENTÖR)</option>
                        </select>
                    </div>

                    <button onclick="kaydet()" class="btn-hybrid">
                        VERİYİ İŞLE <i class="fas fa-arrow-right ms-2"></i>
                    </button>
                    
                    <div id="basari_msg">
                        <i class="fas fa-check-circle me-2"></i>KAYIT SİSTEME İŞLENDİ
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="hybrid-card" style="min-height: 600px; padding: 1.5rem;">
                    <div class="list-header">
                        <h5 class="card-title m-0" style="font-size:1.1rem;"><i class="fas fa-database" style="color:var(--neon-blue)"></i> Veritabanı Akışı</h5>
                        <button onclick="verileriCek()" class="btn btn-sm btn-outline-light rounded-pill px-3" style="border-color: #444; color: #aaa;">
                            <i class="fas fa-rotate me-1"></i> Yenile
                        </button>
                    </div>

                    <div class="table-container" id="tablo_govdesi">
                        <div class="text-center text-muted mt-5">
                            <div class="spinner-border text-secondary" role="status" style="width: 2rem; height: 2rem; border-width: 3px;"></div>
                            <p class="mt-3 small" style="letter-spacing: 2px;">SİSTEME BAĞLANILIYOR...</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        verileriCek();

        async function verileriCek() {
            const listeDiv = document.getElementById('tablo_govdesi');
            
            const { data, error } = await sb
                .from('SINAV_AILESI_TABLO')
                .select('*')
                .order('GORUSMENIN_YAPILDIGI_TARIH', { ascending: false });

            if (error) {
                console.error("Hata:", error);
                listeDiv.innerHTML = `<div class="text-center text-danger mt-4">Veri bağlantısı hatası.</div>`;
                return;
            }

            listeDiv.innerHTML = '';

            if (data.length === 0) {
                listeDiv.innerHTML = `<div class="text-center text-muted mt-5" style="opacity:0.5"><i class="fas fa-folder-open fa-3x mb-3"></i><br>VERİ YOK</div>`;
                return;
            }

            data.forEach((kayit) => {
                // Tarih
                let tarihYazi = "-";
                if (kayit.GORUSMENIN_YAPILDIGI_TARIH) {
                    const d = new Date(kayit.GORUSMENIN_YAPILDIGI_TARIH);
                    tarihYazi = d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' }) + 
                                " / " + d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                }

                // Uzman İkonu
                let uIcon = "fa-user-tie";
                if(kayit.GORUSMEYI_YAPAN_UZMAN?.includes("Emine")) uIcon = "fa-brain";
                else if(kayit.GORUSMEYI_YAPAN_UZMAN?.includes("Bülent")) uIcon = "fa-user-md";
                else if(kayit.GORUSMEYI_YAPAN_UZMAN?.includes("Çelik")) uIcon = "fa-book-reader";
                else if(kayit.GORUSMEYI_YAPAN_UZMAN?.includes("Altunkaya")) uIcon = "fa-stopwatch";

                // Badge Rengi (Neonlu)
                let badge = kayit.UZMANLIGINIZ_KAPSAMINDA_SORUN_VAR_MIYDI === "EVET" 
                    ? `<div class="status-pill pill-neon-green"><i class="fas fa-check-circle me-1"></i> EVET</div>`
                    : `<div class="status-pill pill-neon-red"><i class="fas fa-times-circle me-1"></i> HAYIR</div>`;

                const kart = `
                    <div class="list-card">
                        <div>
                            <div class="name-text">${kayit.GORUSME_YAPILAN_KISI}</div>
                            <div class="date-text"><i class="far fa-clock"></i> ${tarihYazi}</div>
                        </div>
                        
                        <div class="expert-info">
                            <i class="fas ${uIcon}"></i> ${kayit.GORUSMEYI_YAPAN_UZMAN}
                        </div>

                        ${badge}
                    </div>
                `;
                listeDiv.innerHTML += kart;
            });
        }

        async function kaydet() {
            const kisi = document.getElementById('kisi').value;
            const tarih = document.getElementById('tarih').value;
            const kapsam = document.getElementById('kapsam').value;
            const uzman = document.getElementById('uzman').value;

            if (!kisi || !tarih) {
                alert("Lütfen zorunlu alanları doldurunuz.");
                return;
            }

            const { error } = await sb
                .from('SINAV_AILESI_TABLO')
                .insert({ 
                    GORUSME_YAPILAN_KISI: kisi,
                    GORUSMENIN_YAPILDIGI_TARIH: tarih,
                    UZMANLIGINIZ_KAPSAMINDA_SORUN_VAR_MIYDI: kapsam,
                    GORUSMEYI_YAPAN_UZMAN: uzman
                });

            if (error) {
                alert("Sistem Hatası: " + error.message);
            } else {
                const msg = document.getElementById('basari_msg');
                msg.style.display = 'block';
                document.getElementById('kisi').value = '';
                verileriCek();
                setTimeout(() => { msg.style.display = 'none'; }, 2500);
            }
        }

        async function cikisYap() {
            await sb.auth.signOut();
            window.location.href = "yonetim.html";
        }
    </script>
</body>
</html>
