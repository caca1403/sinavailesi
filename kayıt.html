    <style>
        /* --- STİLLER --- */
        :root {
            --neon-teal: #00f3ff;
            --neon-blue: #0066ff;
            --neon-red: #ff0055;
            --neon-yellow: #ffcc00;
            --brand-teal: #1abc9c;
            --dark-metal: #111;
            --panel-bg: rgba(25, 25, 25, 0.85);
            --text-highlight: #fff;
            --text-muted: #aaa;
        }

        body {
            background-color: #020204;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 243, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 102, 255, 0.08) 0%, transparent 50%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-highlight);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding-bottom: 3rem;
        }

        .hybrid-nav {
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            padding: 1rem 0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
        }

        .brand-logo { font-weight: 900; font-size: 1.4rem; text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); letter-spacing: 1px; }

        /* --- DASHBOARD KARTLARI (YENİ) --- */
        .stat-card {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .stat-card::after { content:''; position:absolute; bottom:0; left:0; width:100%; height:3px; }
        .stat-blue::after { background: var(--neon-blue); }
        .stat-red::after { background: var(--neon-red); }
        .stat-green::after { background: var(--neon-green); }

        .stat-num { font-size: 2.5rem; font-weight: 900; color: #fff; line-height: 1; }
        .stat-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-top: 5px; }

        /* --- DİĞER KARTLAR --- */
        .hybrid-card {
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
            position: relative; overflow: hidden;
        }
        .hybrid-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--neon-teal), var(--neon-blue));
            box-shadow: 0 2px 15px rgba(0, 243, 255, 0.4);
        }

        h5.card-title { font-weight: 700; color: white; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }

        /* INPUTLAR */
        .input-wrapper { margin-bottom: 1.5rem; position: relative; }
        .form-label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; display: block; letter-spacing: 1px; }
        .real-input {
            width: 100%; background: #0a0a0a; border: 1px solid #222; border-radius: 8px; padding: 14px 15px; color: #fff;
            box-shadow: inset 3px 3px 8px rgba(0,0,0,0.9), inset -1px -1px 3px rgba(255,255,255,0.05); transition: all 0.3s;
        }
        .real-input:focus { outline: none; border-color: var(--neon-teal); background: #0f0f0f; box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }
        textarea.real-input { resize: vertical; min-height: 80px; }
        select.real-input { appearance: none; cursor: pointer; }
        .select-wrapper::after { content: '▼'; position: absolute; right: 15px; top: 45px; color: var(--neon-teal); font-size: 0.7rem; pointer-events: none; }
        option { background: #111; padding: 10px; }

        /* BUTONLAR */
        .btn-hybrid {
            width: 100%; padding: 16px; margin-top: 20px; border: none; border-radius: 10px;
            background: linear-gradient(145deg, var(--brand-teal), #008cba); color: white; font-weight: 900;
            box-shadow: 0 6px 0 #0e6655, 0 15px 25px rgba(0,0,0,0.6); transition: all 0.15s; cursor: pointer; position: relative; top: 0;
        }
        .btn-hybrid:hover { filter: brightness(1.2); }
        .btn-hybrid:active { top: 6px; box-shadow: 0 0 0 #0e6655; }

        /* FİLTRE VE ARAMA ALANI (YENİ) */
        .filter-group { display: flex; gap: 10px; flex-wrap: wrap; width: 100%; }
        .filter-select, .search-input {
            background: #0a0a0a; color: #fff; border: 1px solid #333;
            border-radius: 20px; padding: 8px 15px; font-size: 0.85rem; outline: none;
        }
        .filter-select:focus, .search-input:focus { border-color: var(--neon-teal); box-shadow: 0 0 10px rgba(0, 243, 255, 0.1); }
        .search-input { flex-grow: 1; } /* Arama kutusu kalan yeri kaplasın */

        .btn-excel {
            background: #107c41; color: white; border: none; border-radius: 20px; padding: 8px 15px; font-size: 0.85rem; cursor: pointer; transition:0.3s;
        }
        .btn-excel:hover { background: #0c5e31; box-shadow: 0 0 10px rgba(16, 124, 65, 0.4); }

        /* LİSTE */
        .list-header { display: flex; flex-direction: column; gap: 15px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .table-container { max-height: 700px; overflow-y: auto; padding-right: 8px; }
        .table-container::-webkit-scrollbar { width: 6px; }
        .table-container::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        .list-card {
            background: rgba(20, 20, 20, 0.6); border-left: 3px solid #333; border-radius: 4px; padding: 1.2rem; margin-bottom: 12px;
            position: relative; transition: all 0.2s;
        }
        .list-card:hover { background: rgba(30, 30, 30, 0.8); border-left-color: var(--neon-teal); transform: translateX(5px); }
        .card-main-content { display: grid; grid-template-columns: 2fr 2fr 1.5fr 1fr; align-items: center; }
        .card-detail { border-top: 1px solid rgba(255,255,255,0.1); margin-top: 10px; padding-top: 10px; font-size: 0.85rem; color: #ccc; font-style: italic; display: flex; align-items: start; gap: 8px; }
        .card-detail i { color: var(--neon-yellow); margin-top: 3px; }

        .status-pill { text-align: center; }
        .pill-neon-green { background: rgba(0, 243, 255, 0.1); color: var(--neon-teal); border: 1px solid var(--neon-teal); padding: 5px 12px; font-size: 0.7rem; font-weight: 700; border-radius: 4px; }
        .pill-neon-red { background: rgba(255, 0, 80, 0.1); color: var(--neon-red); border: 1px solid var(--neon-red); padding: 5px 12px; font-size: 0.7rem; font-weight: 700; border-radius: 4px; }

        .actions { text-align: right; display: flex; justify-content: flex-end; gap: 10px; }
        .btn-action { width: 35px; height: 35px; border-radius: 8px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; color: #000; }
        .btn-edit { background: var(--neon-yellow); }
        .btn-delete { background: var(--neon-red); color: white; }

        /* MODAL */
        .modal-content { background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(0, 243, 255, 0.3); color: white; }
        .modal-header, .modal-footer { border-color: #333; }
        .btn-close { filter: invert(1); }

        .btn-logout { background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 6px 16px; font-size: 0.85rem; transition: 0.3s; font-weight: 700; }
        .btn-logout:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }
        #basari_msg { display:none; margin-top: 20px; padding: 12px; background: rgba(0, 243, 255, 0.1); color: var(--neon-teal); text-align: center; font-weight: 700; border: 1px solid var(--neon-teal); }

        @media (max-width: 768px) {
            .card-main-content { grid-template-columns: 1fr; gap: 12px; text-align: center; }
            .filter-group { flex-direction: column; }
            .col-lg-8 { margin-top: 2rem; }
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        verileriCek();

        // Global değişkenler (Excel için veriyi tutar)
        let mevcutVeriler = [];

        function detayGoster(deger) {
            const detayKutu = document.getElementById('detay_wrapper');
            if (deger === "EVET") detayKutu.style.display = "block";
            else {
                detayKutu.style.display = "none";
                document.getElementById('sorun_detayi').value = "";
            }
        }

        function editDetayGoster(deger) {
            const detayKutu = document.getElementById('edit_detay_wrapper');
            if (deger === "EVET") detayKutu.style.display = "block";
            else detayKutu.style.display = "none";
        }

        async function verileriCek() {
            const listeDiv = document.getElementById('tablo_govdesi');
            const filtreUzman = document.getElementById('uzman_filtre').value;
            const aramaMetni = document.getElementById('arama_kutusu').value.toLowerCase();
            
            // Tüm veriyi çek (Supabase'de 'ilike' ile karmaşık filtre yerine JS ile filtrelemek bazen daha esnektir)
            let query = sb
                .from('SINAV_AILESI_TABLO')
                .select('*')
                .order('GORUSMENIN_YAPILDIGI_TARIH', { ascending: false });

            const { data, error } = await query;

            if (error) {
                console.error("Hata:", error);
                return;
            }

            // --- FİLTRELEME MANTIĞI (JS Tarafı) ---
            let filtrelenmisData = data.filter(item => {
                let uzmanUyumu = (filtreUzman === "TUMU") || (item.GORUSMEYI_YAPAN_UZMAN === filtreUzman);
                let isimUyumu = item.GORUSME_YAPILAN_KISI.toLowerCase().includes(aramaMetni);
                return uzmanUyumu && isimUyumu;
            });

            mevcutVeriler = filtrelenmisData; // Excel için sakla
            istatistikleriGuncelle(filtrelenmisData); // İstatistikleri güncelle

            listeDiv.innerHTML = '';

            if (filtrelenmisData.length === 0) {
                listeDiv.innerHTML = `<div class="text-center text-muted mt-5" style="opacity:0.5"><i class="fas fa-folder-open fa-3x mb-3"></i><br>KAYIT BULUNAMADI</div>`;
                return;
            }

            filtrelenmisData.forEach((kayit) => {
                let tarihYazi = "-";
                if (kayit.GORUSMENIN_YAPILDIGI_TARIH) {
                    const d = new Date(kayit.GORUSMENIN_YAPILDIGI_TARIH);
                    tarihYazi = d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' }) + 
                                " • " + d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                }

                let uIcon = "fa-user";
                if(kayit.GORUSMEYI_YAPAN_UZMAN?.includes("Emine")) uIcon = "fa-brain";
                else if(kayit.GORUSMEYI_YAPAN_UZMAN?.includes("Bülent")) uIcon = "fa-user-md";
                else if(kayit.GORUSMEYI_YAPAN_UZMAN?.includes("Çelik")) uIcon = "fa-book-reader";
                else if(kayit.GORUSMEYI_YAPAN_UZMAN?.includes("Altunkaya")) uIcon = "fa-stopwatch";

                let badge = kayit.UZMANLIGINIZ_KAPSAMINDA_SORUN_VAR_MIYDI === "EVET" 
                    ? `<div class="status-pill pill-neon-green">EVET</div>`
                    : `<div class="status-pill pill-neon-red">HAYIR</div>`;

                let detayHtml = "";
                if (kayit.UZMANLIGINIZ_KAPSAMINDA_SORUN_VAR_MIYDI === "EVET" && kayit.SORUN_DETAYI) {
                    detayHtml = `
                        <div class="card-detail">
                            <i class="fas fa-info-circle"></i>
                            <span>${kayit.SORUN_DETAYI}</span>
                        </div>
                    `;
                }

                const kart = `
                    <div class="list-card">
                        <div class="card-main-content">
                            <div>
                                <div class="name-text">${kayit.GORUSME_YAPILAN_KISI}</div>
                                <div class="date-text"><i class="far fa-clock"></i> ${tarihYazi}</div>
                            </div>
                            <div class="expert-info">
                                <i class="fas ${uIcon}"></i> ${kayit.GORUSMEYI_YAPAN_UZMAN}
                            </div>
                            <div class="data-status">
                                ${badge}
                            </div>
                            <div class="actions">
                                <button class="btn-action btn-edit" onclick="duzenleAc('${kayit.id}', '${kayit.GORUSME_YAPILAN_KISI}', '${kayit.GORUSMENIN_YAPILDIGI_TARIH}', '${kayit.UZMANLIGINIZ_KAPSAMINDA_SORUN_VAR_MIYDI}', '${kayit.GORUSMEYI_YAPAN_UZMAN}', '${kayit.SORUN_DETAYI ? kayit.SORUN_DETAYI.replace(/'/g, "\\'") : ''}')">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn-action btn-delete" onclick="sil('${kayit.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        ${detayHtml}
                    </div>
                `;
                listeDiv.innerHTML += kart;
            });
        }

        // --- İSTATİSTİK HESAPLAMA ---
        function istatistikleriGuncelle(data) {
            const toplam = data.length;
            const sorunlu = data.filter(x => x.UZMANLIGINIZ_KAPSAMINDA_SORUN_VAR_MIYDI === "EVET").length;
            const temiz = toplam - sorunlu;

            document.getElementById('stat_toplam').innerText = toplam;
            document.getElementById('stat_sorunlu').innerText = sorunlu;
            document.getElementById('stat_temiz').innerText = temiz;
        }

        // --- EXCEL İNDİRME ---
        function excelIndir() {
            if (mevcutVeriler.length === 0) { alert("İndirilecek veri yok."); return; }

            let csvContent = "data:text/csv;charset=utf-8,";
            // Başlıklar (BOM ile Türkçe karakter sorunu çözümü)
            csvContent += "\uFEFFİsim,Tarih,Uzman,Durum,Detay\n";

            mevcutVeriler.forEach(row => {
                let tarih = new Date(row.GORUSMENIN_YAPILDIGI_TARIH).toLocaleString('tr-TR');
                let detay = row.SORUN_DETAYI ? row.SORUN_DETAYI.replace(/(\r\n|\n|\r)/gm, " ") : ""; // Satır sonlarını temizle
                let satir = `"${row.GORUSME_YAPILAN_KISI}","${tarih}","${row.GORUSMEYI_YAPAN_UZMAN}","${row.UZMANLIGINIZ_KAPSAMINDA_SORUN_VAR_MIYDI}","${detay}"`;
                csvContent += satir + "\n";
            });

            var encodedUri = encodeURI(csvContent);
            var link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "sinav_ailesi_rapor.csv");
            document.body.appendChild(link);
            link.click();
        }

        async function kaydet() {
            const kisi = document.getElementById('kisi').value;
            const tarih = document.getElementById('tarih').value;
            const kapsam = document.getElementById('kapsam').value;
            const uzman = document.getElementById('uzman').value;
            const detay = document.getElementById('sorun_detayi').value;

            if (!kisi || !tarih) { alert("Zorunlu alanları doldurunuz."); return; }

            const { error } = await sb.from('SINAV_AILESI_TABLO').insert({ 
                GORUSME_YAPILAN_KISI: kisi, GORUSMENIN_YAPILDIGI_TARIH: tarih,
                UZMANLIGINIZ_KAPSAMINDA_SORUN_VAR_MIYDI: kapsam, GORUSMEYI_YAPAN_UZMAN: uzman,
                SORUN_DETAYI: detay
            });

            if (error) alert("Hata: " + error.message);
            else {
                document.getElementById('basari_msg').style.display = 'block';
                document.getElementById('kisi').value = '';
                document.getElementById('sorun_detayi').value = '';
                document.getElementById('detay_wrapper').style.display = 'none';
                verileriCek();
                setTimeout(() => { document.getElementById('basari_msg').style.display = 'none'; }, 2500);
            }
        }

        async function sil(id) {
            if(!confirm("Silmek istediğine emin misin?")) return;
            const { error } = await sb.from('SINAV_AILESI_TABLO').delete().eq('id', id);
            if(error) alert("Silinemedi: " + error.message);
            else verileriCek();
        }

        const editModal = new bootstrap.Modal(document.getElementById('editModal'));

        function duzenleAc(id, kisi, tarih, kapsam, uzman, detay) {
            document.getElementById('edit_id').value = id;
            document.getElementById('edit_kisi').value = kisi;
            document.getElementById('edit_tarih').value = tarih;
            document.getElementById('edit_kapsam').value = kapsam;
            document.getElementById('edit_uzman').value = uzman;
            document.getElementById('edit_sorun_detayi').value = detay || "";
            editDetayGoster(kapsam);
            editModal.show();
        }

        async function guncelle() {
            const id = document.getElementById('edit_id').value;
            const yeniVeri = {
                GORUSME_YAPILAN_KISI: document.getElementById('edit_kisi').value,
                GORUSMENIN_YAPILDIGI_TARIH: document.getElementById('edit_tarih').value,
                UZMANLIGINIZ_KAPSAMINDA_SORUN_VAR_MIYDI: document.getElementById('edit_kapsam').value,
                GORUSMEYI_YAPAN_UZMAN: document.getElementById('edit_uzman').value,
                SORUN_DETAYI: document.getElementById('edit_sorun_detayi').value
            };

            const { error } = await sb.from('SINAV_AILESI_TABLO').update(yeniVeri).eq('id', id);
            
            if(error) alert("Güncellenemedi: " + error.message);
            else { editModal.hide(); verileriCek(); }
        }

        async function cikisYap() {
            await sb.auth.signOut();
            window.location.href = "yonetim.html";
        }
    </script>
</body>
