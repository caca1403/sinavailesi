<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Girişi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        /* --- GENEL ATMOSFER --- */
        body {
            background-color: #050505;
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: background-color 0.1s;
        }

        body.on {
            /* Işık açılınca zemin hafif aydınlanır */
            background: radial-gradient(circle at 50% 60%, #1a1a1a 0%, #000000 70%);
        }

        /* --- TAVAN LAMBASI --- */
        .lamp-assembly {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            z-index: 50;
            display: flex; flex-direction: column; align-items: center;
            transform-origin: top center;
            animation: gentleSwing 5s infinite ease-in-out alternate;
        }

        @keyframes gentleSwing { from { transform: translateX(-50%) rotate(0.5deg); } to { transform: translateX(-50%) rotate(-0.5deg); } }

        .cord { width: 4px; height: 80px; background: #111; box-shadow: 1px 0 2px rgba(255,255,255,0.1); }
        
        .socket {
            width: 50px; height: 50px;
            background: linear-gradient(90deg, #222, #000, #222);
            border-radius: 5px 5px 15px 15px;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.1);
            position: relative;
        }

        .bulb {
            width: 70px; height: 70px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%; margin-top: -10px;
            position: relative; z-index: -1;
            transition: 0.1s;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
        }

        body.on .bulb {
            background: #fff;
            box-shadow: 0 0 60px #fff, 0 0 150px #ffeb3b, inset 0 0 20px #fff;
        }

        /* --- ZİNCİR (PULL CHAIN) --- */
        .switch-hitbox {
            position: absolute; top: 30px; right: -25px; width: 60px; height: 180px;
            cursor: pointer; z-index: 100; display: flex; flex-direction: column; align-items: center;
        }
        .chain {
            width: 4px; height: 120px;
            background: radial-gradient(circle, #888 40%, #222 100%);
            background-size: 4px 6px; background-repeat: repeat-y;
            transition: height 0.1s;
        }
        .knob {
            width: 14px; height: 20px;
            background: radial-gradient(circle at 30% 30%, #d4af37, #8a6e12);
            border-radius: 40% 40% 50% 50%; margin-top: -2px;
            box-shadow: 0 4px 5px rgba(0,0,0,0.5); transition: transform 0.1s;
        }
        .switch-hitbox:active .chain { height: 140px; }
        .switch-hitbox:active .knob { transform: translateY(20px); }

        /* --- SPOT IŞIĞI --- */
        .light-cone {
            position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 300px solid transparent;
            border-right: 300px solid transparent;
            border-bottom: 900px solid rgba(255, 255, 220, 0.03); /* Çok hafif tozlu ışık */
            opacity: 0; pointer-events: none; transition: opacity 0.1s; filter: blur(40px);
            z-index: 10;
        }
        body.on .light-cone { opacity: 1; }

        /* --- YAZI --- */
        .guide-text {
            position: absolute; top: 220px; color: #444; font-size: 0.8rem; letter-spacing: 2px;
            opacity: 0.6; transition: opacity 0.5s; pointer-events: none; text-transform: uppercase; font-weight: 700;
        }
        body.on .guide-text { opacity: 0; }

        /* --- YENİ FORM ALANI (GERÇEKÇİ PANEL) --- */
        .login-wrapper {
            position: relative; z-index: 20; margin-top: 180px;
            opacity: 0; transform: scale(0.95) translateY(30px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none;
        }
        body.on .login-wrapper { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }

        .realistic-card {
            background: linear-gradient(145deg, #1c1c1c, #252525);
            padding: 3rem 2.5rem;
            width: 360px;
            border-radius: 20px;
            /* Derin gölge (Masada duruyormuş gibi) */
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.8),
                inset 0 1px 1px rgba(255,255,255,0.1);
            border-top: 1px solid #333;
            text-align: center;
            position: relative;
        }

        /* Tepedeki metalik plaka */
        .card-header-plate {
            background: #111;
            margin: -3rem -2.5rem 2rem -2.5rem;
            padding: 1.5rem;
            border-radius: 20px 20px 0 0;
            border-bottom: 2px solid #1abc9c;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        h4 { margin: 0; color: #eee; font-weight: 800; letter-spacing: 1px; font-size: 1.2rem; }
        .sub-text { color: #555; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; margin-top: 5px; }

        /* Gömülü Input Alanları (Inset Effect) */
        .input-group-dark {
            position: relative; margin-bottom: 1.2rem;
        }
        
        .form-control-dark {
            background: #0f0f0f;
            border: none;
            border-bottom: 2px solid #333;
            border-radius: 8px;
            padding: 15px 15px 15px 45px;
            color: #ddd;
            width: 100%;
            font-size: 0.95rem;
            box-shadow: inset 2px 2px 8px rgba(0,0,0,0.9), inset -1px -1px 2px rgba(255,255,255,0.05);
            transition: all 0.3s;
        }

        .form-control-dark:focus {
            outline: none;
            background: #000;
            border-bottom-color: #1abc9c;
            color: #fff;
            box-shadow: inset 2px 2px 10px rgba(0,0,0,1), 0 5px 15px rgba(26, 188, 156, 0.1);
        }

        /* İkonlar */
        .input-icon {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: #444; transition: 0.3s;
        }
        .form-control-dark:focus + .input-icon { color: #1abc9c; }

        /* Fiziksel Buton */
        .btn-physical {
            width: 100%; padding: 14px; margin-top: 10px;
            background: linear-gradient(145deg, #1abc9c, #16a085);
            border: none; border-radius: 10px;
            color: white; font-weight: 800; letter-spacing: 1px;
            box-shadow: 
                0 6px 0 #0e6655, 
                0 15px 20px rgba(0,0,0,0.4);
            transition: all 0.1s;
            cursor: pointer;
            position: relative; top: 0;
        }

        .btn-physical:active {
            top: 6px; /* Basılma hissi */
            box-shadow: 
                0 0 0 #0e6655, 
                inset 0 0 10px rgba(0,0,0,0.4);
        }

        #hata { color: #e74c3c; font-size: 0.8rem; margin-top: 15px; font-weight: 700; display: none; text-transform: uppercase; }

    </style>
</head>
<body>

    <div class="lamp-assembly">
        <div class="cord"></div>
        <div class="socket">
            <div class="switch-hitbox" onclick="toggleLight()" title="Çek">
                <div class="chain"></div>
                <div class="knob"></div>
            </div>
        </div>
        <div class="bulb"></div>
    </div>

    <div class="light-cone"></div>

    <div class="guide-text">Işığı Aç</div>

    <div class="login-wrapper">
        <div class="realistic-card">
            
            <div class="card-header-plate">
                <h4>ADMİN ERİŞİMİ</h4>
                <div class="sub-text">Sistem Güvenlik Kilidi</div>
            </div>

            <div class="input-group-dark">
                <input type="email" id="email" class="form-control-dark" placeholder="E-posta">
                <i class="fas fa-user input-icon"></i>
            </div>

            <div class="input-group-dark">
                <input type="password" id="password" class="form-control-dark" placeholder="Şifre">
                <i class="fas fa-key input-icon"></i>
            </div>
            
            <button onclick="girisYap()" class="btn-physical">
                <span id="btnText">SİSTEME GİR</span>
                <span id="spinner" class="spinner-border spinner-border-sm" style="display:none"></span>
            </button>
            
            <p id="hata"><i class="fas fa-exclamation-triangle me-1"></i> Hatalı Giriş</p>
        </div>
    </div>

    <script>
        const SB_URL = 'https://ibsoxmtdmlzflvdnsenj.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlic294bXRkbWx6Zmx2ZG5zZW5qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwOTU5ODgsImV4cCI6MjA4MDY3MTk4OH0.NFeO1KUR5FVPADuAuFS0ogmSfcM_-W_XkpUhGuCPqHc';
        const sb = supabase.createClient(SB_URL, SB_KEY);

        let isOn = false;
        function toggleLight() {
            isOn = !isOn;
            if(isOn) document.body.classList.add('on');
            else document.body.classList.remove('on');
        }

        sb.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.href = "kayıt.html";
        });

        document.addEventListener('keydown', (e) => {
            if(e.key === 'Enter' && isOn) girisYap();
        });

        async function girisYap() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const hata = document.getElementById('hata');
            const btnTxt = document.getElementById('btnText');
            const spin = document.getElementById('spinner');

            if(!email || !pass) {
                hata.style.display = 'block';
                hata.innerHTML = "Boş alan bırakmayınız.";
                return;
            }

            hata.style.display = 'none';
            btnTxt.style.display = 'none';
            spin.style.display = 'inline-block';

            const { error } = await sb.auth.signInWithPassword({ email: email, password: pass });

            if (error) {
                hata.style.display = 'block';
                hata.innerHTML = '<i class="fas fa-times me-1"></i> Hatalı Şifre!';
                btnTxt.style.display = 'inline';
                spin.style.display = 'none';
            } else {
                window.location.href = "kayıt.html";
            }
        }
    </script>
</body>
</html>
